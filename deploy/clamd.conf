# clamd — loopback TCP only, never reachable off-host.
TCPSocket 3310
TCPAddr 127.0.0.1
# Run in the foreground so supervisord owns the process (does not daemonize).
Foreground true
DatabaseDirectory /var/lib/clamav
StreamMaxLength 10M
MaxThreads 4
LogFile /tmp/clamd.log
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
