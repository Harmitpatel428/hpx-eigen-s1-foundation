# freshclam — signature updater. ONLY freshclam.conf-valid directives here
# (LogFile is a clamd directive; the updater uses UpdateLogFile).
DatabaseDirectory /var/lib/clamav
DatabaseOwner root
UpdateLogFile /var/log/clamav/freshclam.log
LogFileMaxSize 0
LogVerbose false
DatabaseMirror database.clamav.net
Checks 24
