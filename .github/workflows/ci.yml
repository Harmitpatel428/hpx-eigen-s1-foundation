name: CI
# Replicates Render's ISOLATED (non-workspace) build so lockfile drift and build
# breaks fail HERE, in CI, instead of at deploy time. GitHub Actions checks out
# only this repo, so npm runs standalone (no parent workspace) exactly like Render.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # match Render's node:20 (npm 10.8.x)
      - name: Install (strict, from lockfile)
        run: npm ci             # fails if package-lock.json drifts from package.json
      - name: Build
        run: npm run build      # prisma generate && tsc
