name: CI
# Replicates Render's ISOLATED (non-workspace) build so lockfile drift and build
# breaks fail HERE, in CI, instead of at deploy time. GitHub Actions checks out
# only this repo, so npm runs standalone (no parent workspace) exactly like Render.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # match Render's node:20 (npm 10.8.x)
      - name: Install (strict, from lockfile)
        run: npm ci             # fails if package-lock.json drifts from package.json
      - name: Build
        run: npm run build      # prisma generate && tsc

  drift:
    runs-on: ubuntu-latest
    # Scratch DB for `prisma migrate diff` only — disposable, dropped with the
    # job. Never points at a real dev/prod database. See scripts/check-drift.sh
    # and scripts/expected-drift.sql (Workstream F drift guard).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install (strict, from lockfile)
        run: npm ci
      - name: Prisma drift check
        run: npm run drift:check
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift_shadow
